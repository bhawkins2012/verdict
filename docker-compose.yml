services:
  postgres:
    image: pgvector/pgvector:pg16
    container_name: verdict-postgres
    environment:
      POSTGRES_USER: verdict_user
      POSTGRES_PASSWORD: verdict_dev_password
      POSTGRES_DB: verdict_db
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      # -h 127.0.0.1 forces a TCP check. Without it pg_isready uses the unix socket, and on first boot
      # the image's temporary init server listens on the socket only, so the container would report
      # healthy before Postgres is reachable over TCP (and `up --wait` would return early).
      test: ["CMD-SHELL", "pg_isready -h 127.0.0.1 -U verdict_user -d verdict_db"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 30s

  redis:
    image: redis:7-alpine
    container_name: verdict-redis
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5

volumes:
  postgres_data:
  redis_data:
