version: '3.9'

services:
  postgres:
    image: pgvector/pgvector:pg16
    container_name: verdict-postgres
    environment:
      POSTGRES_USER: verdict_user
      POSTGRES_PASSWORD: verdict_dev_password
      POSTGRES_DB: verdict_db
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U verdict_user -d verdict_db"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: verdict-redis
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5

volumes:
  postgres_data:
  redis_data:
