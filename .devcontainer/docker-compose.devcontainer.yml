version: '3.9'

services:
  # The Codespaces workspace container itself
  app:
    image: mcr.microsoft.com/devcontainers/universal:2
    volumes:
      - ..:/workspaces:cached
    command: sleep infinity
    environment:
      - DATABASE_URL=postgresql://verdict_user:verdict_dev_password@postgres:5432/verdict_db
      - REDIS_URL=redis://redis:6379
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

  # Override postgres to use internal hostname
  postgres:
    environment:
      POSTGRES_USER: verdict_user
      POSTGRES_PASSWORD: verdict_dev_password
      POSTGRES_DB: verdict_db

  redis: {}
